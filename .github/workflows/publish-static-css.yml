name: Publish verified static CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-css:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Publish compiled stylesheet
        run: |
          cp out/_next/static/chunks/*.css public/kavanagh-static.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kavanagh-static.css
          git commit -m "chore: publish compiled Kavanagh stylesheet" || exit 0
          git push
